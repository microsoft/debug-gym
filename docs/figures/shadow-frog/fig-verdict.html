<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bug hunting verdicts &mdash; SWE-Bench (50 tasks)</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
         background: #ffffff; color: #1a1a2e; padding: 18px 22px 22px; }
  h1 { font-size: 16px; font-weight: 600; text-align: center; margin-bottom: 18px; color: #1a1a2e; }
  .two-col { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(360px, 1.2fr);
             gap: 28px; max-width: 1080px; margin: 0 auto; align-items: center; }
  .chart-wrap { position: relative; height: 360px; min-width: 0; }
  .legend { display: grid; grid-template-columns: 1fr; gap: 8px;
            font-size: 13px; color: #1a1a2e; }
  .legend-item { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: baseline;
                 padding: 8px 12px; border: 1px solid #e5e7eb; border-radius: 6px; background: #fafafa; }
  .legend-swatch { width: 14px; height: 14px; border-radius: 3px; transform: translateY(2px); }
  .legend-text strong { display: block; font-weight: 600; }
  .legend-text span { color: #6b7280; font-size: 12px; }
  .legend-count { font-variant-numeric: tabular-nums; color: #1a1a2e; font-weight: 600; }
  .legend-count small { color: #6b7280; font-weight: 400; margin-left: 4px; }
  @media (max-width: 760px) {
    .two-col { grid-template-columns: 1fr; }
    .chart-wrap { height: 320px; max-width: 420px; margin: 0 auto; width: 100%; }
  }
</style>
</head><body>
<h1>Bug hunting verdicts on SWE-Bench (50 real bugs, blind)</h1>

<div class="two-col">
  <div class="chart-wrap"><canvas id="chart"></canvas></div>
  <div class="legend" id="legend"></div>
</div>

<script>
const TIERS = [
  { key: 'identified', headline: 'Exact bug found',
    desc: 'A developer could fix it from the report alone.',
    count: 11, color: '#C62828' },
  { key: 'adjacent',   headline: 'Same function, different bug',
    desc: 'Real issue in the same function as the gold patch.',
    count: 10, color: '#E65100' },
  { key: 'area',       headline: 'Right subsystem, wrong function',
    desc: 'Explored the right file/module but missed the specific function.',
    count: 23, color: '#2E7D32' },
  { key: 'missed',     headline: 'Unrelated findings',
    desc: 'Findings sit outside the bug\u2019s file or subsystem.',
    count: 6,  color: '#BDBDBD' },
];

const TOTAL = TIERS.reduce((a, t) => a + t.count, 0);

new Chart(document.getElementById('chart'), {
  type: 'doughnut',
  data: {
    labels: TIERS.map(t => t.headline),
    datasets: [{
      data: TIERS.map(t => t.count),
      backgroundColor: TIERS.map(t => t.color),
      borderWidth: 2, borderColor: '#fff',
    }],
  },
  options: {
    responsive: true, maintainAspectRatio: false,
    cutout: '55%',
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          label: (ctx) => `${ctx.label}: ${ctx.raw} of ${TOTAL} tasks (${(ctx.raw/TOTAL*100).toFixed(0)}%)`,
        },
      },
      datalabels: {
        color: (ctx) => ctx.dataIndex === 3 ? '#1a1a2e' : '#ffffff',
        font: { size: 14, weight: 600 },
        formatter: (v) => `${(v/TOTAL*100).toFixed(0)}%`,
      },
    },
  },
  plugins: [ChartDataLabels],
});

const legendEl = document.getElementById('legend');
for (const t of TIERS) {
  const pct = (t.count / TOTAL * 100).toFixed(0);
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.innerHTML = `
    <div class="legend-swatch" style="background:${t.color};"></div>
    <div class="legend-text"><strong>${t.headline}</strong><span>${t.desc}</span></div>
    <div class="legend-count">${t.count}<small>/${TOTAL} (${pct}%)</small></div>
  `;
  legendEl.appendChild(item);
}
</script>
</body></html>
