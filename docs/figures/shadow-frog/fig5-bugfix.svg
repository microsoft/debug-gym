<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img"
     aria-label="Where the +4.7 pp comes from. Left: per-task outcomes for 50 SWE-Bench Verified tasks. Six Shadow-Frog unique wins, two Baseline unique wins, one tied, seven both-fail, thirty-four both-pass. Right: hint-delivery to consumption funnel showing 50 tasks total, 23 receive hints, 12 are opened, 2 are judged relevant, 1 actually changes the outcome.">
  <defs>
    <style>
      .panel-title    { fill: #1a1a2e; font: 600 14px -apple-system, "Segoe UI", sans-serif; }
      .cell-label     { font: 600 11px -apple-system, "Segoe UI", sans-serif; fill: #1a1a2e; }
      .cell-sub       { font: 500 10.5px -apple-system, "Segoe UI", sans-serif; fill: #6b7280; }
      .group-label    { font: 600 11px -apple-system, "Segoe UI", sans-serif; }
      .annotation     { font: italic 500 11.5px -apple-system, "Segoe UI", sans-serif; fill: #4b5563; }
      .annotation-strong { font: 600 11.5px -apple-system, "Segoe UI", sans-serif; fill: #1a1a2e; }
      .divider        { stroke: #d1d5db; stroke-width: 1; stroke-dasharray: 4 4; }
      .funnel-bar     { stroke: rgba(0,0,0,0.06); stroke-width: 1; }
      .funnel-label   { font: 500 12px -apple-system, "Segoe UI", sans-serif; fill: #1a1a2e; text-anchor: end; }
      .funnel-count   { font: 700 12.5px -apple-system, "Segoe UI", sans-serif; fill: #1a1a2e; }
      .funnel-pct     { font: 500 10.5px -apple-system, "Segoe UI", sans-serif; fill: #6b7280; }
      .callout        { font: 600 11.5px -apple-system, "Segoe UI", sans-serif; fill: #1a1a2e; }
    </style>
  </defs>

