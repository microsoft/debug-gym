  <!-- Spotlight annotation -->
  <text class="annotation-strong" x="30" y="218">One of the 6 SF wins is pytest-7324 — the only shadow-driven win:</text>
  <text class="annotation" x="30" y="237">a cross-file shadow doc mapped pytest’s mark-expression pipeline;</text>
  <text class="annotation" x="30" y="253">a fix recipe at <tspan style="font-family:'SF Mono', Menlo, monospace; font-size: 11px;">expression.py</tspan> told the agent exactly how to patch it.</text>
  <text class="annotation" x="30" y="269">All 3 SF seeds → 5-line fix.  2 of 3 BL seeds → rewrote ~80 lines.</text>
  <text class="annotation" x="30" y="293">The other 5 SF wins came from the structured</text>
  <text class="annotation" x="30" y="309">investigate-first workflow — not from shadow content.</text>

  <!-- ================================================================ -->
  <!-- Divider                                                          -->
  <!-- ================================================================ -->
  <line class="divider" x1="540" y1="40" x2="540" y2="340"/>

  <!-- ================================================================ -->
  <!-- RIGHT PANEL: Hint-delivery to consumption funnel                  -->
  <!-- ================================================================ -->

  <text class="panel-title" x="780" y="30" text-anchor="middle">Hint-delivery → consumption funnel</text>
  <text class="cell-sub"    x="780" y="48" text-anchor="middle">How far each stage’s tasks survive to the next</text>

  <!-- Funnel bars: sqrt-scaled width so small counts stay visible.
       Scale: width = sqrt(count) * 38, bars start at x=700.
       50 -> 269, 23 -> 182, 12 -> 132, 2 -> 54, 1 -> 38 -->

  <!-- Bar 1: 50 all tasks -->
  <text class="funnel-label" x="695" y="92">All tasks</text>
  <rect class="funnel-bar" x="700" y="78" width="269" height="22" fill="#94a3b8" rx="3"><title>All tasks: 50 SWE-Bench Verified tasks (3 seeds each)</title></rect>
  <text class="funnel-count" x="977" y="92" text-anchor="start">50</text>

  <!-- Bar 2: 23 hints delivered (46% of universe) -->
  <text class="funnel-label" x="695" y="132">Pre-filter delivered hints</text>
  <rect class="funnel-bar" x="700" y="118" width="182" height="22" fill="#22c55e" rx="3"><title>Pre-filter delivered shadow hints to the agent for 23 of 50 tasks (46%)</title></rect>
  <text class="funnel-count" x="890" y="132" text-anchor="start">23</text>
  <text class="funnel-pct"   x="916" y="132" text-anchor="start">(46% of 50)</text>

  <!-- Bar 3: 12 read (52% of previous) -->
  <text class="funnel-label" x="695" y="172">Agent opened</text>
  <rect class="funnel-bar" x="700" y="158" width="132" height="22" fill="#0ea5e9" rx="3"><title>Agent actually opened the shadow file in 12 of those 23 cases (52%)</title></rect>
  <text class="funnel-count" x="840" y="172" text-anchor="start">12</text>
  <text class="funnel-pct"   x="866" y="172" text-anchor="start">(52% of 23)</text>

  <!-- Bar 4: 2 relevant (17% of previous) -->
  <text class="funnel-label" x="695" y="212">Judged relevant</text>
  <rect class="funnel-bar" x="700" y="198" width="54" height="22" fill="#f59e0b" rx="3"><title>Of the 12 opened, the agent judged 2 hints relevant to the bug at hand (17%)</title></rect>
  <text class="funnel-count" x="762" y="212" text-anchor="start">2</text>
  <text class="funnel-pct"   x="780" y="212" text-anchor="start">(17% of 12)</text>

  <!-- Bar 5: 1 influenced outcome -->
  <text class="funnel-label" x="695" y="252">Changed the outcome</text>
  <rect class="funnel-bar" x="700" y="238" width="38" height="22" fill="#dc2626" rx="3"><title>Only 1 case (pytest-7324) where the hint demonstrably changed the fix outcome across all 3 seeds</title></rect>
  <text class="funnel-count" x="746" y="252" text-anchor="start">1</text>
  <text class="funnel-pct"   x="760" y="252" text-anchor="start">(pytest-7324)</text>

  <!-- Callout box under funnel -->
  <rect x="565" y="282" width="425" height="58" fill="#f0f7f0" stroke="#16a34a" stroke-width="1" rx="4"/>
  <text class="callout"   x="580" y="302">Read path = solid (§1: 99% recall on planted needles).</text>
  <text class="annotation" x="580" y="320">The bottleneck is <tspan font-weight="700" fill="#1a1a2e">consumption</tspan>: the agent rarely opens the</text>
  <text class="annotation" x="580" y="334">hints it’s given, and most of the +4.7 pp comes from the workflow.</text>
</svg>
